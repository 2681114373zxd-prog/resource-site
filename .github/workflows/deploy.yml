# 这是一个 GitHub Actions 工作流：每次 push 到 main 分支时自动构建并部署到 GitHub Pages。
# 使用前：仓库 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 页面手动点一下运行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 检查数据（有问题会给出中文提示）
        run: node scripts/check.mjs

      # 自检必须在构建之前跑：build.mjs 会重写 js/home.js / js/app.js 和各个详情页，
      # 先构建再自检的话，「产物是否是最新的」这条用例永远通过（等于没测）。
      - name: 运行自检
        run: node scripts/test.mjs

      - name: 构建静态站点
        run: node scripts/build.mjs

      # 第一次部署最常见的失败原因：仓库还没开启 Pages。
      # 这里提前检查一次并给出中文操作指引，比 configure-pages 的英文报错友好得多。
      - name: 检查 GitHub Pages 是否已开启
        run: node scripts/check-pages.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建结果（dist 目录）
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
