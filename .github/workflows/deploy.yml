# 这是一个 GitHub Actions 工作流：每次 push 到 main 分支时自动构建并部署到 GitHub Pages。
# 使用前：仓库 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 页面手动点一下运行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 检查数据（有问题会给出中文提示）
        run: node scripts/check.mjs

      - name: 构建静态站点
        run: node scripts/build.mjs

      # 构建之后再自检：这样即使你忘记在本地跑 npm run build，
      # CI 也会用最新源码重新生成 js/home.js、js/app.js 和各个详情页，部署不会挂。
      - name: 运行自检
        run: node scripts/test.mjs

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建结果（dist 目录）
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
